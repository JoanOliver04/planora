name: Bundle analysis
on:
  pull_request:
    paths:
      - "src/**"
      - "next.config.ts"
      - "package*.json"
      - ".github/workflows/bundle-analysis.yml"
permissions:
  contents: read
concurrency:
  group: bundles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: after
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: after/package-lock.json
      - run: mkdir artifacts
      - name: Capture baseline
        working-directory: before
        run: |
          set -o pipefail
          npm ci
          npx next analyze --output --snapshot before-${{ github.run_id }}
          npx next analyze export --snapshot before-${{ github.run_id }} | gzip > ../artifacts/before.jsonl.gz
      - name: Capture candidate
        working-directory: after
        run: |
          set -o pipefail
          npm ci
          npx next analyze --output --snapshot after-${{ github.run_id }}
          npx next analyze export --snapshot after-${{ github.run_id }} | gzip > ../artifacts/after.jsonl.gz
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-graphs
          path: artifacts/*.jsonl.gz
          retention-days: 14

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node scripts/audit-high.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-key
          NEXT_PUBLIC_SITE_URL: https://planora-lake-one.vercel.app
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Start isolated Supabase
        run: |
          umask 077
          start_log=$(mktemp "$RUNNER_TEMP/planora-supabase-start.XXXXXX")
          trap 'rm -f -- "$start_log"' EXIT
          if ! npx --yes supabase@2.115.0 start > "$start_log" 2>&1; then
            echo "Unable to start isolated Supabase; startup output is withheld because it may contain generated credentials."
            exit 1
          fi
      - name: Export integration environment
        run: |
          umask 077
          env_file=$(mktemp "$RUNNER_TEMP/planora-supabase.XXXXXX")
          trap 'rm -f -- "$env_file"' EXIT
          npx --yes supabase@2.115.0 status -o env > "$env_file"
          chmod 600 "$env_file"
          source "$env_file"
          : "${API_URL:?Missing local Supabase API URL}"
          : "${ANON_KEY:?Missing local Supabase anon key}"
          : "${SERVICE_ROLE_KEY:?Missing local Supabase service key}"
          while IFS= read -r line; do
            value=${line#*=}
            value=${value#\"}
            value=${value%\"}
            if [ -n "$value" ]; then
              value=${value//'%'/'%25'}
              value=${value//$'\r'/'%0D'}
              value=${value//$'\n'/'%0A'}
              printf '::add-mask::%s\n' "$value"
            fi
          done < "$env_file"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Stop isolated Supabase
        if: always()
        run: npx --yes supabase@2.115.0 stop --no-backup
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-key
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - name: Start production server
        run: |
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          echo "server failed to start"
          cat /tmp/next-start.log
          exit 1
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:3000/es
            http://127.0.0.1:3000/es/demo/today
          uploadArtifacts: true
          temporaryPublicStorage: true
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
